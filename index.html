function updateStats(){$('totalStat').textContent=vocab.length;$('learnedStat').textContent=Object.values(history).filter(x=>x.correct>0).length;$('wrongStat').textContent=lastWrong.length}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(custom){let r=$('range').value;let pool=custom|| (r==='wrong'?vocab.filter(v=>lastWrong.includes(v.word)):r==='all'?vocab:vocab.filter(v=>Number(v.set)===Number(r)));if(!pool.length){alert(r==='wrong'?'復習する間違い単語がありません。':'この範囲に単語がありません。');return}pool=[...pool];if($('shuffle').checked)shuffle(pool);let n=$('count').value==='all'?pool.length:Number($('count').value);queue=pool.slice(0,n);idx=score=streak=0;missed=[];$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){answered=false;$('next').disabled=true;$('feedback').classList.add('hidden');let v=queue[idx];$('progress').textContent=`${idx+1} / ${queue.length}`;$('streak').textContent=`正解 ${score}`;$('bar').style.width=`${idx/queue.length*100}%`;$('word').textContent=v.word;let distractors=shuffle(vocab.filter(x=>x.word!==v.word));let opts=shuffle([v,...distractors.slice(0,3)]);$('choices').innerHTML='';opts.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="num">${['A','B','C','D'][i]}</span><span>${o.meaning}</span>`;b.onclick=()=>answer(b,o,v);$('choices').appendChild(b)})}
function answer(btn,o,v){if(answered)return;answered=true;let ok=o.word===v.word;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent.includes(v.meaning))b.classList.add('correct')});if(ok){score++;streak++;history[v.word]=history[v.word]||{correct:0,wrong:0};history[v.word].correct++;lastWrong=lastWrong.filter(w=>w!==v.word);$('feedback').className='feedback good';$('feedback').textContent='正解！ '+v.word+'：'+v.meaning}else{streak=0;btn.classList.add('wrong');history[v.word]=history[v.word]||{correct:0,wrong:0};history[v.word].wrong++;if(!missed.some(x=>x.word===v.word))missed.push(v);if(!lastWrong.includes(v.word))lastWrong.push(v.word);$('feedback').className='feedback bad';$('feedback').textContent='不正解。正解は「'+v.meaning+'」です。';}save();$('streak').textContent=`正解 ${score}`;$('feedback').classList.remove('hidden');$('next').disabled=false;$('next').textContent=idx===queue.length-1?'結果を見る →':'次の問題 →'}
function finish(){ $('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('scoreStat').textContent=`${score}/${queue.length}`;$('rateStat').textContent=Math.round(score/queue.length*100)+'%';$('newWrongStat').textContent=missed.length;$('resultLine').textContent=`${queue.length}問中 ${score}問正解。${missed.length?'間違えた単語を復習しましょう。':'全問正解です！'}`;$('review').innerHTML=missed.length?missed.map(v=>`<div class="reviewrow"><b>${v.word}</b><span>${v.meaning}</span></div>`).join(''):'<p class="intro">間違えた単語はありません。</p>';$('retryWrong').disabled=!missed.length;$('retryWrong').style.opacity=missed.length?1:.5;updateStats()}
$('start').onclick=()=>start();$('next').onclick=()=>{if(idx<queue.length-1){idx++;render()}else finish()};$('quit').onclick=()=>finish();$('home').onclick=()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden')};$('retryWrong').onclick=()=>start(missed);updateStats();
</script></body></html>
